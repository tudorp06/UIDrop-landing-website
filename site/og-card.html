@font-face {

* { margin: 0; padding: 0; box-sizing: border-box; }

  background: #07090f;
}
body {

.card {

  height: 630px;
  padding: 64px 80px 56px;

  flex-direction: column;

  background: #07090f;
}
.brand {

.brand img {

}
.wordmark {

  max-width: 1040px;
  color: #f4f7ff;
}
.slogan em {
  font-style: normal;
  color: #60a5fa;
}
.agents {
  display: flex;
  align-items: flex-end;
  gap: 36px;
}
.agent {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}
.agent img {
  width: 44px;
  height: 44px;
  object-fit: contain;
  border-radius: 10px;
}
.agent svg {
  width: 44px;
  height: 44px;
  display: block;
}
.agent span {
  font-family: Switzer, sans-serif;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.1px;
  color: #c5cde0;
